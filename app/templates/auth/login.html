{% extends "base.html" %}
{% block title %}Login - SANT Digital Solution{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="header-brand" style="border-radius: 10px 10px 0 0;">
                <h4><i class="bi bi-mortarboard-fill"></i> Maa Kamala Public School</h4>
                <p>Rokdi, Karchhana, Prayagraj</p>
            </div>
            <div class="card-body p-4">
                <h5 class="text-center mb-3">Login to ERP</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
            </div>
            <div class="card-footer text-center text-muted" style="font-size: .75rem;">
                Developed and Powered by Sant Digital Solution
            </div>
        </div>
    </div>
</div>
{% endblock %}
